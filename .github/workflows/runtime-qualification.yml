name: Runtime qualification

on:
  workflow_dispatch:
    inputs:
      case:
        description: 'Optional qualification case ID'
        required: false
        type: string
      backend:
        description: 'Optional backend: wasm or webgpu'
        required: false
        type: string

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm qualify -- --browser chromium ${{ inputs.case != '' && format('--case {0}', inputs.case) || '' }} ${{ inputs.backend != '' && format('--backend {0}', inputs.backend) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-qualification-results
          path: tests/runtime-qualification/results
